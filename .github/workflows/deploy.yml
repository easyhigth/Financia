name: Déploiement GitHub Pages

# Publie l'application à chaque push : aucun redéploiement manuel n'est nécessaire.
on:
  push:
    branches:
      - main
      - 'claude/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write # nécessaire pour supprimer l'archive d'un essai précédent

# Un seul déploiement à la fois ; les pushes rapprochés ne s'annulent pas mutuellement
# une fois la publication lancée.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Le navigateur ne détecte une mise à jour que si sw.js change octet par octet.
      # On y injecte le SHA du commit : chaque publication devient donc automatiquement
      # une nouvelle version, sans avoir à penser à incrémenter un numéro à la main.
      - name: Injecter l'identifiant de build dans le service worker
        run: |
          sed -i "s/__BUILD_ID__/${GITHUB_SHA::12}/" sw.js
          grep -n "BUILD_ID" sw.js

      - name: Contrôle du contenu pédagogique
        run: node scripts/check-content.mjs

      # On ne publie que ce qui sert à l'application (ni .git, ni workflow, ni scripts).
      - name: Préparer le site
        run: |
          mkdir -p _site
          cp -r index.html manifest.json sw.js .nojekyll README.md css js icons _site/
          ls -R _site | head -40

      - uses: actions/configure-pages@v5

      # Relancer uniquement le job échoué d'un run produit une seconde archive
      # « github-pages » ; l'étape de publication en trouve alors deux et refuse de
      # publier. On supprime donc celles d'un essai précédent avant d'en produire une.
      - name: Nettoyer les archives d'un essai précédent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ids=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
                  --jq '.artifacts[] | select(.name=="github-pages") | .id' || true)
          for id in $ids; do
            echo "suppression de l'archive $id"
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/$id" || true
          done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - id: deployment
        uses: actions/deploy-pages@v4
